<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200">
  <defs>
    <style>
      .box { fill: #fafaf9; stroke: #1f2937; stroke-width: 2; }
      .box-accent { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
      .box-human { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; }
      .title { font-family: ui-monospace, monospace; font-size: 14px; font-weight: bold; fill: #1f2937; }
      .subtitle { font-family: ui-monospace, monospace; font-size: 11px; fill: #6b7280; }
      .arrow { stroke: #9ca3af; stroke-width: 2; fill: none; }
      .arrow-head { fill: #9ca3af; }
      .step-num { font-family: ui-monospace, monospace; font-size: 10px; fill: #9ca3af; }
    </style>
  </defs>

  <!-- Step 1: File System -->
  <g transform="translate(20, 30)">
    <text class="step-num" x="0" y="0">01</text>
    <rect class="box" x="0" y="10" width="230" height="120" rx="4"/>
    <text class="title" x="115" y="45" text-anchor="middle">Persistent File System</text>
    <text class="subtitle" x="115" y="67" text-anchor="middle">expert calls, earnings, filings</text>
    <text class="subtitle" x="115" y="82" text-anchor="middle">deal memos, meeting notes</text>
    <text class="subtitle" x="115" y="97" text-anchor="middle">10,000s of sources</text>
    <text class="subtitle" x="115" y="112" text-anchor="middle">accumulating over time</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(260, 90)">
    <path class="arrow" d="M 0,0 L 55,0"/>
    <polygon class="arrow-head" points="55,-5 65,0 55,5"/>
  </g>

  <!-- Step 2: LLM Connections -->
  <g transform="translate(325, 30)">
    <text class="step-num" x="0" y="0">02</text>
    <rect class="box-accent" x="0" y="10" width="230" height="120" rx="4"/>
    <text class="title" x="115" y="45" text-anchor="middle">LLM Reads + Connects</text>
    <text class="subtitle" x="115" y="67" text-anchor="middle">full documents, not chunks</text>
    <text class="subtitle" x="115" y="82" text-anchor="middle">no embeddings or KG needed</text>
    <text class="subtitle" x="115" y="97" text-anchor="middle">surfaces contradictions</text>
    <text class="subtitle" x="115" y="112" text-anchor="middle">reasoning IS the query engine</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(565, 90)">
    <path class="arrow" d="M 0,0 L 55,0"/>
    <polygon class="arrow-head" points="55,-5 65,0 55,5"/>
  </g>

  <!-- Step 3: We Write -->
  <g transform="translate(630, 30)">
    <text class="step-num" x="0" y="0">03</text>
    <rect class="box-human" x="0" y="10" width="230" height="120" rx="4"/>
    <text class="title" x="115" y="45" text-anchor="middle">We Write the Thesis</text>
    <text class="subtitle" x="115" y="67" text-anchor="middle">human judgment is the filter</text>
    <text class="subtitle" x="115" y="82" text-anchor="middle">AI surfaces material</text>
    <text class="subtitle" x="115" y="97" text-anchor="middle">we form the opinion</text>
    <text class="subtitle" x="115" y="112" text-anchor="middle">every word is ours</text>
  </g>

  <!-- Feedback loop -->
  <path class="arrow" d="M 745,160 Q 745,185 440,185 Q 135,185 135,160" stroke-dasharray="4,4"/>
  <text class="subtitle" x="440" y="200" text-anchor="middle">new sources arrive, theses evolve</text>
</svg>
